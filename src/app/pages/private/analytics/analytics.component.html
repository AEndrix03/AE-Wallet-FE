<article class="px-4 py-6 flex flex-col gap-4">
  <div class="flex flex-row gap-3 items-center">
    <div class="basis-4/7 h-[30rem]">
      <wlt-card>
        <div class="p-3">
          <wlt-analytics-general-portfolios [data]="deviationData()" />
        </div>
      </wlt-card>
    </div>

    <div class="basis-3/7 h-[30rem]">
      <wlt-card>
        <div class="p-3">
          <wlt-analytics-portfolios-top [data]="deviationData()" />
        </div>
      </wlt-card>
    </div>
  </div>
  <div class="flex flex-row gap-3 items-center">
    <div class="basis-3/7 h-[30rem]">
      <wlt-card>
        <div class="p-3">
          <wlt-analytics-preferences [data]="partitionsData()" [preferences]="preferedPartitionsData()" />
        </div>
      </wlt-card>
    </div>
  </div>
</article>
