<main class="min-h-screen bg-neutral-50 dark:bg-neutral-900">
  <div class="max-w-7xl mx-auto px-6 py-8 space-y-8">

    <!-- KPI Overview -->
    <section>
      <wlt-card>
        <wlt-analytics-summary [data]="summaryData()" />
      </wlt-card>
    </section>

    <!-- Primary Charts Row -->
    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <wlt-card>
        <div class="p-6 h-full">
          <wlt-analytics-income-expense [data]="incomeExpenseData()" />
        </div>
      </wlt-card>

      <wlt-card>
        <div class="p-6 h-full">
          <wlt-analytics-category [data]="categoryData()" />
        </div>
      </wlt-card>
    </section>

    <!-- Portfolio Performance Section -->
    <section class="grid grid-cols-1 xl:grid-cols-3 gap-6">
      <div class="xl:col-span-2">
        <wlt-card>
          <div class="p-6 h-[35rem]">
            <wlt-analytics-general-portfolios [data]="deviationData()" />
          </div>
        </wlt-card>
      </div>

      <wlt-card>
        <div class="p-6 h-[35rem]">
          <wlt-analytics-portfolios-top [data]="deviationData()" />
        </div>
      </wlt-card>
    </section>

    <!-- Allocation Comparison -->
    <section>
      <wlt-card>
        <div class="p-6">
          <wlt-analytics-preferences
            [data]="partitionsData()"
            [preferences]="preferedPartitionsData()" />
        </div>
      </wlt-card>
    </section>

  </div>
</main>
