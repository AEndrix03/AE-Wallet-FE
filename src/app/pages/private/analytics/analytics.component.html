<article class="px-4 py-6 flex flex-col gap-4">
  <div class="flex flex-row gap-3 items-center">
    <div class="basis-4/7 h-[45rem]">
      <wlt-card>
        <div class="p-3">
          <wlt-analytics-summary [data]="summaryData()" />
        </div>
      </wlt-card>
    </div>
    <div class="flex-1 flex flex-col gap-[1rem]">
      <div class="w-full h-[20rem]">
        <wlt-card>
          <div class="p-3 h-fit">
            <wlt-analytics-income-expense [data]="incomeExpenseData()" />
          </div>
        </wlt-card>
      </div>
      <div class="w-full h-[24rem]">
        <wlt-card>
          <div class="p-3">
            <wlt-analytics-category [data]="categoryData()" />
          </div>
        </wlt-card>
      </div>
    </div>
  </div>
  <div class="flex flex-row gap-3 items-center">
    <div class="basis-4/7 h-[30rem]">
      <wlt-card>
        <div class="p-3">
          <wlt-analytics-general-portfolios [data]="deviationData()" />
        </div>
      </wlt-card>
    </div>

    <div class="basis-3/7 h-[30rem]">
      <wlt-card>
        <div class="p-3">
          <wlt-analytics-portfolios-top [data]="deviationData()" />
        </div>
      </wlt-card>
    </div>
  </div>
  <div class="flex flex-row gap-3 items-center">
    <div class="basis-3/7 h-[30rem]">
      <wlt-card>
        <div class="p-3">
          <wlt-analytics-preferences [data]="partitionsData()" [preferences]="preferedPartitionsData()" />
        </div>
      </wlt-card>
    </div>
  </div>
</article>
