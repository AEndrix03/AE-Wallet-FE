<div class="p-6">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
    @for (kpi of kpis(); track kpi.label) {
      <div
        class="group relative overflow-hidden rounded-xl bg-gradient-to-br transition-all duration-200 hover:scale-105"
        [class]="getBackgroundClass(kpi.variant)">

        <!-- Background Pattern -->
        <div class="absolute inset-0 opacity-5">
          <div class="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent"></div>
        </div>

        <div class="relative p-4">
          <!-- Icon -->
          <div [class]="getIconWrapperClass(kpi.variant)">
            <i [class]="kpi.icon + ' text-lg'" [class]="getIconClass(kpi.variant)"></i>
          </div>

          <!-- Content -->
          <div class="mt-4 space-y-1">
            <p class="text-sm font-medium opacity-90" [class]="getTextClass(kpi.variant)">
              {{ kpi.label }}
            </p>
            <p class="text-2xl font-bold" [class]="getTextClass(kpi.variant)">
              {{ formatValue(kpi.value, kpi.format) }}
            </p>

            @if (kpi.trend !== undefined) {
              <div class="flex items-center gap-1 text-xs font-medium"
                   [class]="getTrendClass(kpi.trend, kpi.variant)">
                <i [class]="getTrendIcon(kpi.trend)"></i>
                <span>{{ Math.abs(kpi.trend).toFixed(1) }}%</span>
                <span class="opacity-75">vs last month</span>
              </div>
            }
          </div>
        </div>
      </div>
    }
  </div>
</div>
