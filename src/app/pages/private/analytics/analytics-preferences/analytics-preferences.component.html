<article class="flex flex-col h-full">
  <h2 class="pl-4 m-0 text-xl font-bold text-gray-900 dark:text-gray-100 mb-6">
    Portfolio Allocation Comparison
  </h2>

  <div class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-6">
    <wlt-chart
      [config]="actualChartConfig"
      [data]="actualChartData()" />

    <wlt-chart
      [config]="desiredChartConfig"
      [data]="desiredChartData()" />
  </div>
</article>
