<article class="flex flex-col gap-4 h-full">
  <h2 class="pl-4 m-0 text-xl font-bold text-gray-900 dark:text-gray-100 mb-6 flex items-center gap-2">
    <i class="pi pi-trophy text-yellow-500"></i>
    Top Performers
  </h2>

  <div class="flex-1 px-4 space-y-3 overflow-y-auto py-1">
    @for (portfolio of rankedPortfolios(); let i = $index; track portfolio.rank) {
      <div
        class="flex items-center gap-4 p-3 bg-gray-50 dark:bg-gray-800 rounded-lg transition-all hover:bg-gray-100 dark:hover:bg-gray-700"
        [class.ring-2]="i < 2"
        [class.ring-yellow-400]="i === 0"
        [class.ring-gray-400]="i === 1">

        <!-- Rank Badge -->
        <p-badge
          [value]="portfolio.rank"
          [severity]="getBadgeSeverity(i)"
          class="text-sm font-bold">
        </p-badge>

        <!-- Color Indicator -->
        <div
          class="w-3 h-3 rounded-full"
          [style.backgroundColor]="portfolio.color">
        </div>

        <div class="flex-1 min-w-0">
          <div class="font-medium text-gray-900 dark:text-gray-100 truncate">
            {{ portfolio.name }}
          </div>
          <div class="text-sm text-gray-600 dark:text-gray-400 flex items-center gap-2">
            <span>{{ portfolio.avgDeviation | number:'1.1-1' }}% avg deviation</span>
            <i [class]="getTrendIcon(portfolio.trend) + ' ' + getTrendClass(portfolio.trend)"></i>
          </div>
        </div>

        <div (click)="$event.stopPropagation()">
          <p-rating
            [ngModel]="portfolio.rating"
            [disabled]="true"
            class="text-sm">
          </p-rating>
        </div>
      </div>
    }
  </div>
</article>
