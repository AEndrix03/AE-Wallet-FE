<article [ngClass]="transactions()?.content?.length == 0 ? 'invisible' : ''">
  <p-table
    [value]="transactions()?.content"
    [paginator]="true"
    [rows]="transactions()?.pageable?.pageSize || 50"
    [lazy]="true"
    [totalRecords]="transactions()?.totalElements || 0"
    [tableStyle]="{ 'min-width': '50rem' }"
    [rowsPerPageOptions]="[10, 50, 100, 200]"
    (onLazyLoad)="onPaginationChangeEvent($event)"
    styleClass="custom-table"
  >
    <ng-template pTemplate="header">
      <tr class="border-b border-gray-700">
        <th class="!px-4 !py-3 !bg-gray-800 !text-gray-200 !font-semibold !text-sm">Id</th>
        <th class="!px-4 !py-3 !bg-gray-800 !text-gray-200 !font-semibold !text-sm">Description</th>
        <th class="!px-4 !py-3 !bg-gray-800 !text-gray-200 !font-semibold !text-sm">Amount</th>
        <th class="!px-4 !py-3 !bg-gray-800 !text-gray-200 !font-semibold !text-sm">Date</th>
        <th class="!px-4 !py-3 !bg-gray-800 !text-gray-200 !font-semibold !text-sm">Portfolio</th>
        <th class="!px-4 !py-3 !bg-gray-800 !text-gray-200 !font-semibold !text-sm">Note</th>
        <th class="!px-4 !py-3 !bg-gray-800 !text-gray-200 !font-semibold !text-sm">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr class="border-b border-gray-700 hover:bg-gray-800/50 transition-colors">
        <td class="!px-4 !py-3 !text-sm"
            [ngClass]="{
            '!bg-green-900/20 hover:!bg-green-900/30 !text-green-400': row.type === 'INCOME',
            '!bg-red-900/20 hover:!bg-red-900/30 !text-red-400': row.type === 'EXPENSE'
          }">
          {{ row.id }}
        </td>
        <td class="!px-4 !py-3 !text-sm"
            [ngClass]="{
            '!bg-green-900/20 hover:!bg-green-900/30 !text-green-400': row.type === 'INCOME',
            '!bg-red-900/20 hover:!bg-red-900/30 !text-red-400': row.type === 'EXPENSE'
          }">
          {{ row.description }}
        </td>
        <td class="!px-4 !py-3 !text-sm !font-semibold"
            [ngClass]="{
            '!bg-green-900/20 hover:!bg-green-900/30 !text-green-400': row.type === 'INCOME',
            '!bg-red-900/20 hover:!bg-red-900/30 !text-red-400': row.type === 'EXPENSE'
          }">
          {{ row.amount }} {{ row.currency }}
        </td>
        <td class="!px-4 !py-3 !text-sm !text-gray-400"
            [ngClass]="{
            '!bg-green-900/20 hover:!bg-green-900/30 !text-green-400': row.type === 'INCOME',
            '!bg-red-900/20 hover:!bg-red-900/30 !text-red-400': row.type === 'EXPENSE'
          }">
          {{ row.date | date: 'dd/MM/yyyy HH:mm:ss' }}
        </td>
        <td class="!px-4 !py-3 !text-sm"
            [ngClass]="{
            '!bg-green-900/20 hover:!bg-green-900/30 !text-green-400': row.type === 'INCOME',
            '!bg-red-900/20 hover:!bg-red-900/30 !text-red-400': row.type === 'EXPENSE'
          }">
          {{ row.portfolioName }}
        </td>
        <td class="!px-4 !py-3 !text-sm !text-gray-400"
            [ngClass]="{
            '!bg-green-900/20 hover:!bg-green-900/30 !text-green-400': row.type === 'INCOME',
            '!bg-red-900/20 hover:!bg-red-900/30 !text-red-400': row.type === 'EXPENSE'
          }">
          {{ row.note }}
        </td>
        <td class="!px-4 !py-3 !text-sm"
            [ngClass]="{
      '!bg-green-900/20 hover:!bg-green-900/30': row.type === 'INCOME',
      '!bg-red-900/20 hover:!bg-red-900/30': row.type === 'EXPENSE'
    }">
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            size="small"
            (onClick)="deleteTransaction(row.id)">
          </p-button>
        </td>

      </tr>
    </ng-template>
  </p-table>
</article>
