<article>
  <wlt-filters-template (onSearch)="_onSearch()" (onReset)="_onReset()">
    <ng-container>
      <div class="flex flex-row flex-wrap gap-4">
        <wlt-input-date-range label="Date range" [fromControl]="dateFromFc()" [toControl]="dateToFc()" />
        <wlt-input-text label="Description" [control]="descriptionFc()" class="min-w-[16rem]" />
        <wlt-input-number label="Amount" [control]="amountFc()" />
        <wlt-select label="Type" [control]="typeFc()" [options]="typeOptions()" />
        <wlt-select label="Currency" [control]="currencyFc()" [options]="currencyOptions()" />
        <wlt-select label="Category" [control]="categoryFc()" [options]="categoryOptions()" />
      </div>
      <p-divider />
      <wlt-button label="Add new Transaction" severity="secondary" (onClick)="onCreate.emit()" />
    </ng-container>
  </wlt-filters-template>
</article>
