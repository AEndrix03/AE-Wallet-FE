<article
  class="group flex flex-row justify-center items-center w-[20rem] h-[30rem] border-4 border-dashed border-slate-300 dark:border-slate-600 rounded-xl cursor-pointer hover:border-emerald-500 hover:bg-emerald-50/30 dark:hover:bg-emerald-900/10 transition-all duration-500 ease-in-out hover:scale-105 hover:shadow-lg animate-pulse hover:animate-none"
  (click)="create.emit()">

  <div class="relative">
    <i
      class="pi pi-plus p-6 border-4 border-dashed border-slate-400 dark:border-slate-500 rounded-full cursor-pointer group-hover:border-emerald-500 group-hover:bg-emerald-500 group-hover:text-white transition-all duration-300 ease-out transform group-hover:scale-110 group-hover:rotate-90 text-slate-500 dark:text-slate-400"
      style="font-size: 2.5rem"
      (click)="create.emit()">
    </i>

    <div
      class="absolute inset-0 rounded-full bg-emerald-500/20 scale-0 group-hover:scale-125 transition-transform duration-500 ease-out opacity-0 group-hover:opacity-100"></div>
  </div>

  <div
    class="absolute bottom-8 text-center opacity-0 group-hover:opacity-100 transition-all duration-300 delay-150 transform translate-y-4 group-hover:translate-y-0">
    <p
      class="text-sm font-medium text-slate-600 dark:text-slate-400 group-hover:text-emerald-600 dark:group-hover:text-emerald-400">
      Crea nuovo portfolio
    </p>
  </div>
</article>
